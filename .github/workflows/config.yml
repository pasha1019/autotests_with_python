name: UI Tests

on: workflow_dispatch

jobs:
  ui-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('**/docker-compose.yml') }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Run tests with Docker Compose
        env:
          LOGIN: ${{ secrets.LOGIN }}
          PASSWORD: ${{ secrets.PASSWORD }}
        run: |
          docker compose build
          docker compose up --exit-code-from autotests || true  # Продолжить даже при ошибке

      - name: Generate and deploy Allure report
        run: |
          # Создаем директории
          sudo mkdir -p allure-results/history allure-report
          sudo chmod -R 777 allure-results  # Даем полные права
          
          # Генерируем отчет
          docker compose run --rm autotests allure generate allure-results --clean -o allure-report
          
          # Деплоим на GitHub Pages
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git clone https://github.com/${{ github.repository }}.git --branch gh-pages --single-branch gh-pages
          cp -r allure-report/* gh-pages/
          cd gh-pages
          git add .
          git commit -m "Update Allure report"
          git push
