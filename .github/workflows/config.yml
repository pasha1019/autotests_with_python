name: UI Tests

on: workflow_dispatch

jobs:
  ui-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-history

      - name: Run UI-tests via docker-compose
        env:
          LOGIN: ${{ secrets.LOGIN }}
          PASSWORD: ${{ secrets.PASSWORD }}
        run: |
          docker compose up --exit-code-from autotests || true

      - name: Prepare directories
        run: |
          mkdir -p allure-results/history
          mkdir -p gh-pages-history/history

      - name: Copy existing history to allure-results
        run: |
          if [ -d "gh-pages-history/history" ] && [ "$(ls -A gh-pages-history/history)" ]; then
            echo "Copying existing history..."
            cp -R gh-pages-history/history/* allure-results/history/
          else
            echo "No history found, first run"
          fi

      - name: Generate Allure report
        run: |
          docker compose run autotests /bin/sh -c "allure generate allure-results --clean -o allure-report"

      - name: Copy new history to gh-pages directory
        run: |
          if [ -d "allure-report/history" ] && [ "$(ls -A allure-report/history)" ]; then
            echo "Updating history..."
            cp -R allure-report/history/* gh-pages-history/history/
          else
            echo "No new history generated"
          fi

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          folder: allure-report
          clean: true

      - name: Commit and push history updates
        run: |
          cd gh-pages-history
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add history/
          
          if git diff --staged --quiet; then
            echo "No changes to history"
          else
            git commit -m "Update Allure history [skip ci]"
            git push
          fi